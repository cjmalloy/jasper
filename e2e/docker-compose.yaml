services:
  playwright:
    build: .
    profiles:
      - ci
    depends_on:
      client:
        condition: service_started
      web:
        condition: service_healthy
      repl-web:
        condition: service_healthy
      tunnel-web:
        condition: service_healthy
      ssh:
        condition: service_healthy
    network_mode: host
    environment:
      BASE_URL: http://localhost:8080
      MAIN_API: http://localhost:8081
      REPL_API: http://localhost:8083
      TUNNEL_API: http://localhost:8085
      CI: true
    volumes:
      - ./:/e2e
      - /e2e/node_modules
  # jasper-ui pointed at the main server, used for UI driven tests
  client:
    image: ghcr.io/cjmalloy/jasper-ui:${JASPER_UI_TAG:-master}
    ports:
      - 8080:80
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: 1
      JASPER_API: http://localhost:8081
      CSP_DEFAULT_SRC: http://localhost:8081 ws://localhost:8081
      CSP_CONNECT_SRC: http://localhost:8081 ws://localhost:8081
      JASPER_TITLE: E2E
    depends_on:
      - web
  # Main server under test (default origin), authenticated with debug JWTs
  web:
    build: ..
    ports:
      - 8081:80
    healthcheck:
      test: "curl -f http://localhost/management/health/readiness"
      interval: 5s
      retries: 60
    environment:
      SPRING_LOGGING_LEVEL_ROOT: WARN
      SPRING_PROFILES_ACTIVE: prod,jwt,storage,file-cache,scripts,proxy
      SPRING_DATASOURCE_URL: jdbc:postgresql://db/jasper
      SPRING_DATASOURCE_USERNAME: jasper
      SPRING_DATASOURCE_PASSWORD: jasper
      SERVER_PORT: 80
      JASPER_CORS_ALLOWED_ORIGINS: 'http://localhost:8080'
      JASPER_CORS_ALLOWED_METHODS: '*'
      JASPER_CORS_ALLOWED_HEADERS: '*'
      JASPER_CORS_EXPOSED_HEADERS: 'Authorization,Link,X-Total-Count'
      JASPER_CORS_ALLOW_CREDENTIALS: true
      JASPER_CORS_MAX_AGE: 1800
      JASPER_OVERRIDE_SECURITY_MODE: 'jwt'
      JASPER_OVERRIDE_SECURITY_CLIENT_ID: ''
      # Debug secret shared with jasper-ui ?debug=ADMIN tokens (DO NOT USE IN PRODUCTION)
      JASPER_OVERRIDE_SECURITY_BASE64_SECRET: 'MjY0ZWY2ZTZhYmJhMTkyMmE5MTAxMTg3Zjc2ZDlmZWUwYjk0MDgzODA0MDJiOTgyNTk4MmNjYmQ4Yjg3MmVhYjk0MmE0OGFmNzE2YTQ5ZjliMTEyN2NlMWQ4MjA5OTczYjU2NzAxYTc4YThkMzYxNzdmOTk5MTIxODZhMTkwMDM='
      JASPER_HEAP: 256m
      JASPER_CACHE_API: http://web
    depends_on:
      - db
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: jasper
      POSTGRES_PASSWORD: jasper
      POSTGRES_DB: jasper
  # Remote server for direct HTTP origin push and pull (@repl)
  repl-web:
    build: ..
    ports:
      - 8083:80
    healthcheck:
      test: "curl -f http://localhost/management/health/readiness"
      interval: 5s
      retries: 60
    environment:
      SPRING_LOGGING_LEVEL_ROOT: WARN
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://repl-db/jasper
      SPRING_DATASOURCE_USERNAME: jasper
      SPRING_DATASOURCE_PASSWORD: jasper
      SERVER_PORT: 80
      JASPER_LOCAL_ORIGIN: '@repl'
      JASPER_DEFAULT_ROLE: ROLE_ADMIN
      JASPER_OVERRIDE_SERVER_WEB_ORIGINS: '@repl'
      JASPER_HEAP: 256m
    depends_on:
      - repl-db
  repl-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: jasper
      POSTGRES_PASSWORD: jasper
      POSTGRES_DB: jasper
  # Remote server behind an SSH tunnel.
  # @open has web access, @tunnel only has SSH access (web access was forgotten).
  tunnel-web:
    build: ..
    ports:
      - 8085:80
    healthcheck:
      test: "curl -f http://localhost/management/health/readiness"
      interval: 5s
      retries: 60
    environment:
      SPRING_LOGGING_LEVEL_ROOT: WARN
      SPRING_PROFILES_ACTIVE: prod,storage
      SPRING_DATASOURCE_URL: jdbc:postgresql://tunnel-db/jasper
      SPRING_DATASOURCE_USERNAME: jasper
      SPRING_DATASOURCE_PASSWORD: jasper
      SERVER_PORT: 80
      JASPER_DEFAULT_ROLE: ROLE_ADMIN
      JASPER_ALLOW_USER_TAG_HEADER: true
      JASPER_OVERRIDE_SERVER_SSH_ORIGINS: '@open,@tunnel'
      JASPER_STORAGE: /var/lib/jasper
      JASPER_HEAP: 256m
    volumes:
      - tunnel-storage:/var/lib/jasper
    depends_on:
      - tunnel-db
  tunnel-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: jasper
      POSTGRES_PASSWORD: jasper
      POSTGRES_DB: jasper
  # SSH server for tunnel-web, reads the authorized_keys and host_key written by tunnel-web.
  # Restarts itself whenever authorized_keys changes.
  ssh:
    image: ghcr.io/cjmalloy/jasper-ssh:${JASPER_SSH_TAG:-latest}
    restart: always
    healthcheck:
      test: /healthcheck.sh
      interval: 2s
      retries: 30
    environment:
      UPSTREAM: http://tunnel-web:80/
    volumes:
      - type: volume
        source: tunnel-storage
        target: /config
        read_only: true
        volume:
          subpath: default/config
      - type: volume
        source: tunnel-storage
        target: /secrets
        read_only: true
        volume:
          subpath: default/secrets
    depends_on:
      tunnel-web:
        condition: service_healthy

volumes:
  tunnel-storage:
