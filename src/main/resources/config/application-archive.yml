# ===================================================================
# Spring Boot configuration for the "archive" profile.
#
# Keeps every version of Refs, Exts, Users, Plugins and Templates by
# adding the modified date to the primary key. Lookups return the
# latest version.
#
# WARNING: Enabling this profile is a one-way migration. The primary
# keys are changed on startup, and switching back to non-archive mode
# requires manually removing old versions and restoring the original
# primary keys. Only supported on PostgreSQL.
# ===================================================================

spring:
  jpa:
    mapping-resources:
      - config/archive-orm.xml
  liquibase:
    parameters:
      archive: true
