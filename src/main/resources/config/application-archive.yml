# ===================================================================
# Spring Boot configuration for the "archive" profile.
#
# Keeps every previous version of Refs, Exts, Users, Plugins and
# Templates in append-only *_archive tables (ref_archive, ext_archive,
# users_archive, plugin_archive, template_archive). The live tables
# are unchanged, so the application behaves exactly as without this
# profile. Disabling the profile stops archiving but keeps the archive
# tables. Only supported on PostgreSQL.
# ===================================================================

spring:
  liquibase:
    parameters:
      archive: true
