openapi: 3.0.3
info:
  title: Jasper Protocol
  description: REST API for the Jasper Protocol
  version: 1.4.3
  license:
    name: MIT License
    url: 'https://github.com/cjmalloy/jasper/blob/master/LICENSE'
servers:
  - description: Public Server
    url: https://jasperkm.info/
paths:
  /api/v1/ref:
    get:
      tags:
        - Ref
      operationId: getRef
      parameters:
        - name: url
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/url'
        - name: origin
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/origin'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Ref'
        '304':
          description: Not Modified
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Ref
      operationId: updateRef
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ref'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/Modified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags:
        - Ref
      operationId: createRef
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ref'
        required: true
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ForeignWrite'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags:
        - Ref
      operationId: patchRef
      parameters:
        - name: url
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/url'
        - name: origin
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/origin'
        - name: cursor
          in: query
          description: The modified date of the entity being patched, used for optimistic locking
          required: true
          schema:
            type: string
            format: date-time
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: 'https://json.schemastore.org/json-patch'
          application/merge-patch+json:
            schema:
              type: object
        required: true
      responses:
        '200':
          $ref: '#/components/responses/Modified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Ref
      operationId: deleteRef
      parameters:
        - name: url
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/url'
        - name: origin
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/origin'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/ref/page:
    get:
      tags:
        - Ref
      operationId: getRefPage
      parameters:
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            minimum: 0
            type: integer
            default: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            minimum: 1
            type: integer
            default: 10
        - name: sort
          in: query
          description: 'Sorting criteria in the format: column[,asc|,desc]. Default sort order is ascending. Multiple sort criteria are supported. JSON columns can be sorted by field with -> (e.g. plugins->plugin/test->size:num, metadata->responses), append :num for numeric or :len for length. Tag values sort with tags->{tag}[:num|:dur] (e.g. tags->plugin/progress:num). See https://github.com/cjmalloy/jasper#sorting'
          required: false
          schema:
            type: array
            items:
              type: string
            default:
              - 'rank,DESC'
              - 'modified,DESC'
        - name: query
          in: query
          description: Tag query, see https://github.com/cjmalloy/jasper#tag-queries
          required: false
          example: 'science:!funny'
          schema:
            $ref: '#/components/schemas/query'
        - name: noDescendents
          in: query
          description: Exclude Refs that have a descendant tag of this tag, e.g. noDescendents=plugin/thread excludes Refs tagged plugin/thread/x
          required: false
          schema:
            $ref: '#/components/schemas/tag'
        - name: nesting
          in: query
          description: Only match Refs with this origin nesting level, where the local origin '' is 0, '@a' is 1 and '@a.b' is 2
          required: false
          schema:
            type: integer
            minimum: 0
        - name: url
          in: query
          description: Only match Refs with this URL
          required: false
          schema:
            $ref: '#/components/schemas/url'
        - name: obsolete
          in: query
          description: true to only match obsolete Refs (another origin has a newer copy of the URL), false to exclude them
          required: false
          schema:
            type: boolean
        - name: scheme
          in: query
          description: Only match Refs with this URL scheme
          required: false
          example: 'https:'
          schema:
            $ref: '#/components/schemas/scheme'
        - name: sources
          in: query
          description: Only match Refs that are sources of this URL (this URL is a response to them)
          required: false
          schema:
            $ref: '#/components/schemas/url'
        - name: noSources
          in: query
          description: Exclude Refs that are sources of this URL
          required: false
          schema:
            $ref: '#/components/schemas/url'
        - name: responses
          in: query
          description: Only match Refs that are responses to this URL (this URL is one of their sources)
          required: false
          schema:
            $ref: '#/components/schemas/url'
        - name: noResponses
          in: query
          description: Exclude Refs that are responses to this URL
          required: false
          schema:
            $ref: '#/components/schemas/url'
        - name: modifiedBefore
          in: query
          description: Only match Refs modified strictly before this time
          required: false
          schema:
            type: string
            format: date-time
        - name: modifiedAfter
          in: query
          description: Only match Refs modified strictly after this time
          required: false
          schema:
            type: string
            format: date-time
        - name: publishedBefore
          in: query
          description: Only match Refs published strictly before this time
          required: false
          schema:
            type: string
            format: date-time
        - name: publishedAfter
          in: query
          description: Only match Refs published strictly after this time
          required: false
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          description: Only match Refs created strictly before this time
          required: false
          schema:
            type: string
            format: date-time
        - name: createdAfter
          in: query
          description: Only match Refs created strictly after this time
          required: false
          schema:
            type: string
            format: date-time
        - name: responseBefore
          in: query
          description: 'Only match Refs whose metadata was last modified strictly before this time (metadata->modified, set whenever responses, plugins or user URLs are recomputed). Refs without metadata never match. Indexed by the metadataModified _config/index flag. For the latest response, use newResponseBefore.'
          required: false
          schema:
            type: string
            format: date-time
        - name: responseAfter
          in: query
          description: 'Only match Refs whose metadata was last modified strictly after this time (metadata->modified, set whenever responses, plugins or user URLs are recomputed). Indexed by the metadataModified _config/index flag. For the latest response, use newResponseAfter.'
          required: false
          schema:
            type: string
            format: date-time
        - name: newResponseBefore
          in: query
          description: 'Only match Refs whose latest response (metadata->newResponse) is strictly before this time. Refs without responses never match. Indexed by the newResponse _config/index flag.'
          required: false
          schema:
            type: string
            format: date-time
        - name: newResponseAfter
          in: query
          description: 'Only match Refs whose latest response (metadata->newResponse) is strictly after this time, e.g. now minus one day for Refs active in the last day. Indexed by the newResponse _config/index flag.'
          required: false
          schema:
            type: string
            format: date-time
        - name: newReactionBefore
          in: query
          description: 'Only match Refs whose latest reaction (metadata->newReaction) is strictly before this time. Refs without reactions never match. Indexed by the newReaction _config/index flag.'
          required: false
          schema:
            type: string
            format: date-time
        - name: newReactionAfter
          in: query
          description: 'Only match Refs whose latest reaction (metadata->newReaction) is strictly after this time. Indexed by the newReaction _config/index flag.'
          required: false
          schema:
            type: string
            format: date-time
        - name: tagBefore
          in: query
          description: 'Only match Refs whose tag value is strictly less than the value: tags->{tag}[:num|:dur]/{value}. The value is always after the last ''/''. Refs without a value never match. Can be repeated, all filters must match. See https://github.com/cjmalloy/jasper#filtering-by-value'
          required: false
          example: ['tags->plugin/progress:num/50']
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/tagValueFilter'
        - name: tagAfter
          in: query
          description: 'Only match Refs whose tag value is strictly greater than the value: tags->{tag}[:num|:dur]/{value}. The value is always after the last ''/''. Refs without a value never match. Can be repeated, all filters must match. See https://github.com/cjmalloy/jasper#filtering-by-value'
          required: false
          example: ['tags->plugin/duration:dur/pt1h']
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/tagValueFilter'
        - name: pluginBefore
          in: query
          description: 'Only match Refs whose plugin value or response count is strictly less than the value: plugins->{plugin}[->{field}...][:num|:len]/{value}, metadata->plugins->{plugin}[:num]/{count} or metadata->remotePlugins->{plugin}[:num]/{count}. Response counts are numbers, Refs without responses count as 0, and are indexed by hotResponses / hotRemoteResponses. The value is always after the last ''/'' and cannot contain ''/'', ''->'' or '',''. Refs without the value never match. Strings compare using the database ordering (locale on PostgreSQL, bytes on SQLite). Can be repeated, all filters must match. See https://github.com/cjmalloy/jasper#filtering-by-value'
          required: false
          example: ['plugins->plugin/test->ids:len/3']
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/pluginValueFilter'
        - name: pluginAfter
          in: query
          description: 'Only match Refs whose plugin value or response count is strictly greater than the value: plugins->{plugin}[->{field}...][:num|:len]/{value}, metadata->plugins->{plugin}[:num]/{count} or metadata->remotePlugins->{plugin}[:num]/{count}. Response counts are numbers, Refs without responses count as 0, and are indexed by hotResponses / hotRemoteResponses. The value is always after the last ''/'' and cannot contain ''/'', ''->'' or '',''. Refs without the value never match. Strings compare using the database ordering (locale on PostgreSQL, bytes on SQLite). Can be repeated, all filters must match. See https://github.com/cjmalloy/jasper#filtering-by-value'
          required: false
          example: ['plugins->_plugin/cache->contentLength:num/1000']
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/pluginValueFilter'
        - name: pluginResponse
          in: query
          description: Only match Refs with a response tagged with each of these plugins
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/tag-plugin'
        - name: noPluginResponse
          in: query
          description: Exclude Refs with a response tagged with any of these plugins
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/tag-plugin'
        - name: remotePluginResponse
          in: query
          description: Only match Refs with a response from any origin tagged with each of these plugins
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/tag-plugin'
        - name: noRemotePluginResponse
          in: query
          description: Exclude Refs with a response from any origin tagged with any of these plugins
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/tag-plugin'
        - name: userResponse
          in: query
          description: Only match Refs the current user has responded to with each of these plugins
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/tag-plugin'
        - name: noUserResponse
          in: query
          description: Exclude Refs the current user has responded to with any of these plugins
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/tag-plugin'
        - name: search
          in: query
          description: Full text search, or an exact URL
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageRef'
        '304':
          description: Not Modified
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
