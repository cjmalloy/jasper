components:
  schemas:
    name:
      type: string
      description: Display name
      example: Name
      maxLength: 512
    url:
      type: string
      format: uri
      pattern: '^[^:/?#]+:(?://[^/?#]*)?[^?#]*(?:\?[^#]*)?(?:#.*)?$'
      description: URL
      example: http://jasper-kms.info/
      maxLength: 4096
    scheme:
      type: string
      pattern: '^[^:/?#]+:$'
      description: Scheme
      example: 'http:'
      maxLength: 4096
    title:
      type: string
      description: Title
      example: Title
      maxLength: 512
    origin:
      type: string
      pattern: '^(?:@[a-z0-9]+(?:[.][a-z0-9]+)*)?$'
      default: ''
      description: Origin
      example: '@origin'
      maxLength: 64
    tag:
      type: string
      pattern: '^[_+]?[a-z0-9]+(?:[./][a-z0-9]+)*$'
      description: Tag
      example: 'tag'
      maxLength: 64
    tagPatch:
      type: string
      pattern: '^[-]?[_+]?[a-z0-9]+(?:[./][a-z0-9]+)*$'
      description: Tag
      example: 'tag'
      maxLength: 65
    qtag:
      type: string
      pattern: '^[_+]?[a-z0-9]+(?:[./][a-z0-9]+)*(?:@|(?:@[a-z0-9]+(?:[.][a-z0-9]+)*)?)$'
      description: Optionally Qualified Tag
      example: 'tag@origin'
      maxLength: 129
    query:
      type: string
      description: "Tag query: tags and origins combined with : (and), | (or), ! (not) and parentheses. See https://github.com/cjmalloy/jasper#querying"
      pattern: '^[!_+a-z0-9/.@|:()*]+$'
      example: '(politics|science):!funny'
      maxLength: 4096
    tag-template:
      type: string
      pattern: '^(?:_?[a-z0-9]+(?:[./][a-z0-9]+)*)?$'
      description: Template Tag
      example: 'kanban'
      maxLength: 64
    qtag-template:
      type: string
      pattern: '^(?:_?[a-z0-9]+(?:[./][a-z0-9]+)*)?(?:@[a-z0-9]+(?:[.][a-z0-9]+)*)?$'
      description: Optionally Qualified Template Tag
      example: 'kanban@origin'
      maxLength: 129
    tag-plugin:
      type: string
      pattern: '^[_+]?plugin(?:/[a-z0-9]+(?:[./][a-z0-9]+)*)?$'
      description: Plugin Tag
      example: 'plugin/thumbnail'
      maxLength: 64
    qtag-plugin:
      type: string
      pattern: '^[_+]?plugin(?:/[a-z0-9]+(?:[./][a-z0-9]+)*)?(?:@[a-z0-9]+(?:[.][a-z0-9]+)*)?$'
      description: Optionally Qualified Plugin Tag
      example: 'plugin/thumbnail@origin'
      maxLength: 129
    tag-user:
      type: string
      pattern: '^[_+]user(?:/[a-z0-9]+(?:[./][a-z0-9]+)*)?$'
      description: User Tag
      example: '+user/charlie'
      maxLength: 64
    qtag-user:
      type: string
      pattern: '^[_+]user(?:/[a-z0-9]+(?:[./][a-z0-9]+)*)?(?:@[a-z0-9]+(?:[.][a-z0-9]+)*)?$'
      description: Optionally Qualified User Tag
      example: '+user/charlie@origin'
      maxLength: 129
    tagValueFilter:
      type: string
      pattern: '^tags->[_+]?[a-z0-9]+(?:[./][a-z0-9]+)*(?::num|:dur)?/[a-z0-9]+(?:[.][a-z0-9]+)*$'
      description: 'Tag value filter: tags->{tag}[:num|:dur]/{value}. The value is the child tag of {tag}, compared as text, as a number (:num, no negative numbers) or as an ISO 8601 duration (:dur, lowercase).'
      example: 'tags->plugin/progress:num/50'
      minLength: 1
      maxLength: 139
    pluginValueFilter:
      type: string
      pattern: '^(?:plugins->[_+]?plugin(?:/[a-z0-9]+(?:[./][a-z0-9]+)*)?(?:->(?:[A-Za-z0-9_$-]+(?:\[[0-9]{1,9}\])?|\[[0-9]{1,9}\]))*(?::num|:len)?|metadata->(?:plugins|remotePlugins)->[_+]?plugin(?:/[a-z0-9]+(?:[./][a-z0-9]+)*)?(?::num)?)/(?:(?!->)[^/,])+$'
      description: 'Plugin value filter: plugins->{plugin}[->{field}...][:num|:len]/{value}. Fields are optional, since plugin data may be a primitive, and may be array indices ([0]). The value is compared as text, as a number (:num) or by array length (:len). Response count filter: metadata->plugins->{plugin}[:num]/{count} or metadata->remotePlugins->{plugin}[:num]/{count}, the count must be a number.'
      example: 'plugins->plugin/test->size:num/1000'
      minLength: 1
      maxLength: 1024
    configValueFilter:
      type: string
      pattern: '^(?:config|defaults|schema|external)(?:->(?:[A-Za-z0-9_$-]+(?:\[[0-9]{1,9}\])?|\[[0-9]{1,9}\]))+(?::num|:len)?/(?:(?!->)[^/,])+$'
      description: 'Config value filter: {field}->{path}[:num|:len]/{value}. Ext allows config, User allows external (MOD only), Plugin and Template allow config, defaults and schema. The value is compared as text, as a number (:num, non-numbers never match) or by array length (:len, non-arrays never match).'
      example: 'config->pinned:len/0'
      minLength: 1
      maxLength: 1024
    Page:
      type: object
      properties:
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Ref:
      required:
        - published
        - url
      type: object
      properties:
        url:
          $ref: '#/components/schemas/url'
        origin:
          $ref: '#/components/schemas/origin'
        title:
          $ref: '#/components/schemas/title'
        comment:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/tag'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/url'
        alternateUrls:
          type: array
          items:
            $ref: '#/components/schemas/url'
        plugins:
          type: object
          example:
            'plugin/thumbnail':
              url: http://example-thumbnail.com/image.png
        metadata:
          $ref: '#/components/schemas/Metadata'
        published:
          type: string
          format: date-time
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
    Metadata:
      type: object
      properties:
        modified:
          type: string
          format: date-time
          description: Last time the responses or plugin counts changed.
        newResponse:
          type: string
          format: date-time
          description: Last time a new response was created, ignoring user urls.
        newReaction:
          type: string
          format: date-time
          description: Last time any response was created or updated, including user urls.
        responses:
          type: number
        internalResponses:
          type: number
        plugins:
          type: object
          additionalProperties:
            type: number
          example:
            'plugin/comment': 3
          description: Plugin response counts from the same origin as this Ref.
        remotePlugins:
          type: object
          additionalProperties:
            type: number
          example:
            'plugin/comment': 5
          description: Total plugin response counts from all origins under the root origin.
        regen:
          type: boolean
          description: Metadata for this Ref is queued for regeneration.
        cascade:
          type: boolean
          description: Source metadata for this Ref is queued for a deferred cascade update.
    RefNode:
      allOf:
        - $ref: '#/components/schemas/Ref'
        - type: object
          properties:
            responses:
              type: array
              items:
                $ref: '#/components/schemas/url'
    PageRef:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
        page:
          $ref: '#/components/schemas/Page'
    Ext:
      required:
        - tag
      type: object
      properties:
        tag:
          $ref: '#/components/schemas/tag'
        origin:
          $ref: '#/components/schemas/origin'
        name:
          $ref: '#/components/schemas/name'
        config:
          type: object
        modified:
          type: string
          format: date-time
    PageExt:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Ext'
        page:
          $ref: '#/components/schemas/Page'
    Plugin:
      required:
        - tag
      type: object
      properties:
        tag:
          $ref: '#/components/schemas/tag-plugin'
        origin:
          $ref: '#/components/schemas/origin'
        name:
          $ref: '#/components/schemas/name'
        config:
          type: object
        defaults:
          type: object
        schema:
          type: object
        generateMetadata:
          type: boolean
        modified:
          type: string
          format: date-time
    PagePlugin:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Plugin'
        page:
          $ref: '#/components/schemas/Page'
    Template:
      type: object
      properties:
        tag:
          $ref: '#/components/schemas/tag-template'
        origin:
          $ref: '#/components/schemas/origin'
        name:
          $ref: '#/components/schemas/name'
        config:
          type: object
        defaults:
          type: object
        schema:
          type: object
        modified:
          type: string
          format: date-time
    PageTemplate:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        page:
          $ref: '#/components/schemas/Page'
    User:
      required:
        - tag
      type: object
      properties:
        tag:
          $ref: '#/components/schemas/tag-user'
        origin:
          $ref: '#/components/schemas/origin'
        name:
          $ref: '#/components/schemas/name'
        readAccess:
          type: array
          items:
            $ref: '#/components/schemas/qtag'
        writeAccess:
          type: array
          items:
