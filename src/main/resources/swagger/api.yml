  /api/v1/graph/list:
    get:
      tags:
        - Graph
      operationId: getGraphList
      parameters:
        - name: urls
          in: query
          required: true
          schema:
            maxItems: 100
            minItems: 0
            type: array
            items:
              $ref: '#/components/schemas/url'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/RefNode'
                    - nullable: true
        '304':
          description: Not Modified
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/tags:
    post:
      tags:
        - Tagging
      operationId: createTags
      parameters:
        - name: tag
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/tag'
        - name: url
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/url'
        - name: origin
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/origin'
      responses:
        '200':
          $ref: '#/components/responses/Modified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Tagging
      operationId: deleteTags
      parameters:
        - name: tag
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/tag'
        - name: url
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/url'
        - name: origin
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/origin'
      responses:
