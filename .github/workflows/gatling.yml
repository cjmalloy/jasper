name: Load Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gatling:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, sqlite]
        gc: [g1gc, parallel, zgc]
        exclude:
          - database: sqlite
            gc: parallel
          - database: sqlite
            gc: zgc
    env:
      JASPER_GC: ${{ matrix.gc }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Set compose command
        id: compose
        run: |
          if [ "${{ matrix.database }}" = "sqlite" ]; then
            echo "cmd=docker compose -f docker-compose.sqlite.yaml --profile lt" >> $GITHUB_OUTPUT
          else
            echo "cmd=docker compose --profile lt" >> $GITHUB_OUTPUT
          fi
      # Each run seeds the @loadtest origin first (skipped when already seeded).
      # Smoke Test and Regression fail the job when their assertions fail.
      - name: Run Smoke Test
        if: always()
        run: (cd gatling; GATLING_TEST=SmokeTest ${{ steps.compose.outputs.cmd }} up --build --exit-code-from gatling)
      - name: Run Regression
        if: always()
        run: (cd gatling; GATLING_TEST=Regression ${{ steps.compose.outputs.cmd }} up --build --exit-code-from gatling)
      # Capacity, Inferno and RateLimit saturate the server on purpose: informational only
      - name: Run Capacity
        if: always()
        continue-on-error: true
        # SQLite saturates at the first 4 sessions/s step: use finer steps so the result has resolution
        run: (cd gatling; LT_CAPACITY_STEP=${{ matrix.database == 'sqlite' && '1' || '4' }} GATLING_TEST=Capacity ${{ steps.compose.outputs.cmd }} up --build --exit-code-from gatling)
      - name: Run Inferno
        if: always()
        continue-on-error: true
        run: (cd gatling; GATLING_TEST=Inferno ${{ steps.compose.outputs.cmd }} up --build --exit-code-from gatling)
      - name: Run RateLimit
        if: always()
        continue-on-error: true
        # Per-origin limit for the bursting origin, below what each database can serve
        run: (cd gatling; LT_RATE_LIMIT=${{ matrix.database == 'sqlite' && '15' || '50' }} GATLING_TEST=RateLimit ${{ steps.compose.outputs.cmd }} up --build --exit-code-from gatling)
      - name: Stop Stack
        if: always()
        run: (cd gatling; ${{ steps.compose.outputs.cmd }} down)
      - name: Generate Report Index
        if: always()
        run: (cd gatling; sudo chown $(whoami) -R report; ./gen-index.sh)
      - name: Patch HTML report
        if: always()
        working-directory: gatling
        # language=bash
        run: |
          # Playwright reports on the same Pages origin share the localStorage "theme" key with values dark-mode|light-mode|system;
          # convert them to Gatling's dark|light and clear anything else so Gatling falls back to the OS preference
          [ -d report ] || exit 0
          find report -mindepth 2 -type f -name '*.html' -print0 | xargs -0 -r sed -i "0,/<head>/s//<head><script>try{const t=localStorage.getItem('theme');if(t==='dark-mode'||t==='light-mode')localStorage.setItem('theme',t.slice(0,-5));else if(!['dark','light',null].includes(t))localStorage.removeItem('theme')}catch(e){}<\/script>/"
      - name: Extract Stats
        if: always()
        run: (cd gatling; mkdir -p report; ./report-stats.py extract report > /tmp/stats.json && cp /tmp/stats.json report/stats.json)
      - name: Find Master Baseline
        if: github.event_name == 'pull_request' && always()
        id: baseline
        uses: actions/github-script@v9
        with:
          # language=JavaScript
          script: |
            const name = 'gatling-baseline-${{ matrix.database }}-${{ matrix.gc }}';
            const response = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name,
              per_page: 100
            });
            const latest = response.data.artifacts
              .filter(artifact => !artifact.expired && artifact.workflow_run?.head_branch === 'master')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (latest) {
              core.setOutput('run_id', latest.workflow_run.id);
              core.setOutput('name', name);
            } else {
              console.log('No master baseline found for', name);
            }
      - name: Download Master Baseline
        if: steps.baseline.outputs.run_id && always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.baseline.outputs.name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/baseline
      - name: Generate Load Test Summary
        if: always()
        run: |
          python3 gatling/report-stats.py markdown /tmp/stats.json /tmp/baseline/stats.json > /tmp/summary.md
          {
            echo "## Load Test Results (${{ matrix.database }}, ${{ matrix.gc }})"
            echo ""
            cat /tmp/summary.md
          } >> $GITHUB_STEP_SUMMARY
      # Only a complete, passing master run becomes the baseline for later PRs
      - name: Check Gating Simulations
        if: github.event_name == 'push' && github.ref_name == 'master' && always()
        id: gate
        run: python3 gatling/report-stats.py gate /tmp/stats.json
      - name: Upload Master Baseline
        if: always() && steps.gate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: gatling-baseline-${{ matrix.database }}-${{ matrix.gc }}
          path: /tmp/stats.json
          retention-days: 90
      - name: Upload PR Report
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v7
        with:
          name: gatling-reports-${{ matrix.database }}-${{ matrix.gc }}-pr-${{ github.event.pull_request.number }}
          path: gatling/report
          retention-days: 7
      - name: Upload Reports
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v7
        with:
          name: gatling-reports-${{ matrix.database }}-${{ matrix.gc }}-${{ github.ref_name }}-${{ github.run_number }}
          path: gatling/report
          retention-days: 90
      - name: Comment on PR with Load Test Summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          # language=JavaScript
          script: |
            const fs = require('fs');
            const marker = '<!-- gatling-results-comment-${{ matrix.database }}-${{ matrix.gc }} -->';
            const summary = fs.existsSync('/tmp/summary.md')
              ? fs.readFileSync('/tmp/summary.md', 'utf8')
              : '_No results could be generated. Please check the workflow logs._';
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/reports/gatling-reports-${{ matrix.database }}-${{ matrix.gc }}-pr-${context.issue.number}/`;
            let comment = `## Load Test Results (${{ matrix.database }}, ${{ matrix.gc }})\n\n`;
            comment += summary + '\n';
            comment += `📈 [View detailed performance reports](${url})\n\n`;
            comment += marker;

            // Find existing comment and update it, or create new one
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              }
            );

            const botComment = comments.find(comment => comment.body.includes(marker));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  clean:
    needs: gatling
    if: always()
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: write
    steps:
      - name: Cleanup old branch artifacts
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          # language=JavaScript
          script: |
            const maxVersions = 10;
            const response = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const artifacts = response.data.artifacts
              .filter(artifact => artifact.name.startsWith('gatling-reports-') && artifact.name.includes('${{ github.ref_name }}'));
            if (artifacts.length > maxVersions) {
              // Sort by created_at descending
              artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              // Delete all but the latest maxVersions
              for (const artifact of artifacts.slice(maxVersions)) {
                console.log('Deleting artifact:', artifact.name);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }
      - name: Cleanup old baselines
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          # language=JavaScript
          script: |
            const maxVersionsPerName = 3;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const groups = {};
            for (const artifact of artifacts.filter(artifact => artifact.name.startsWith('gatling-baseline-'))) {
              (groups[artifact.name] ||= []).push(artifact);
            }
            for (const group of Object.values(groups)) {
              group.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              for (const artifact of group.slice(maxVersionsPerName)) {
                console.log('Deleting artifact:', artifact.name);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }
      - name: Cleanup old PR artifacts
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          # language=JavaScript
          script: |
            const maxVersionsPerName = 1;
            const response = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const artifacts = response.data.artifacts
              .filter(artifact => artifact.name.startsWith('gatling-reports-') && artifact.name.includes('-pr-${{ github.event.pull_request.number }}'));
            // Group artifacts by name to handle multiple database variants (postgres, sqlite)
            const groups = {};
            for (const artifact of artifacts) {
              if (!groups[artifact.name]) groups[artifact.name] = [];
              groups[artifact.name].push(artifact);
            }
            for (const [name, group] of Object.entries(groups)) {
              if (group.length > maxVersionsPerName) {
                group.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                for (const artifact of group.slice(maxVersionsPerName)) {
                  console.log('Deleting artifact:', artifact.name);
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                }
              }
            }
      # Pages workflow_run runs triggered by Copilot need their own approval, so publish reports explicitly
      - name: Publish reports to Pages
        if: github.actor == 'Copilot'
        # language=bash
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ github.token }}
